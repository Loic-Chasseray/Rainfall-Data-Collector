name: Collect Data

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run collection script
        run: node collect.js

      - name: Save updated CSV back to repo
        run: |
          git config user.email "bot@example.com"
          git config user.name "Data Bot"
          git add master.csv
          git commit -m "Daily data update" || echo "No changes"
          git push
